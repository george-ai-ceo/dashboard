<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ page.title | default: site.title }}</title><meta name="description" content="{{ site.description }}">
<style>
body{margin:0;background:#D7FF3F;color:#111713;font:17px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:44px;margin:0;line-height:1}h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;margin:36px 0 10px}
.card{background:#111713;color:#F3F2ED;border-radius:10px;padding:18px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.head .meta{text-align:right}.big{font-size:30px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.grid div{background:#F3F2ED;color:#111713;border-radius:8px;padding:12px}.grid b{display:block;font-size:26px}
table{width:100%;border-collapse:collapse;background:#F3F2ED;border-radius:8px;overflow:hidden;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #d9d8d0;vertical-align:top}th{background:#111713;color:#F3F2ED;font-weight:600}
.bar{height:22px;background:#F3F2ED;border:2px solid #111713;border-radius:12px;overflow:hidden}.bar span{display:block;height:100%;background:#153FE0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:10px;background:#111713;color:#F3F2ED}
.tag.failed,.tag.killed{background:#9F1838}.tag.verified,.tag.won{background:#153FE0}
.note{font-size:15px;margin:10px 0 0}footer{margin-top:40px;font-size:14px;border-top:2px solid #111713;padding-top:12px}
a{color:#153FE0}
</style></head><body><main>{{ content }}</main></body></html>
